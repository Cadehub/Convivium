<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="description" content="Menu numérique et service de commande de Convivium Home Hotel — Douala, Cameroun." />
    
    <!-- PWA & Apple Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Convivium" />

    <title>Convivium Home Hotel — Carte & Commandes</title>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-100 selection:text-stone-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch((err) => console.warn('[PWA] Service worker registration error:', err));
        });
      }
    </script>
  </body>
</html>
